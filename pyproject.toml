[project]
name = "autoprompter"
version = "0.1.0"
description = "Local Romanian voice-following teleprompter for Apple Silicon"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "numpy>=2", "huggingface-hub>=0.30"]
[project.optional-dependencies]
speech = ["parakeet-mlx>=0.4"]
dev = ["pytest>=8", "httpx>=0.28"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
